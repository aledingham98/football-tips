name: nightly-data

on:
  schedule:
    - cron: "0 2 * * *"        # ~02:00 UTC nightly
  workflow_dispatch:
    inputs:
      with_fbref:
        description: "Also attempt the FBref pull (slow, best-effort)"
        type: boolean
        default: true

concurrency:
  group: nightly-data
  cancel-in-progress: false

permissions:
  contents: write               # commit refreshed parquet back to main

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Restore FBref (soccerdata) cache
        uses: actions/cache@v4
        with:
          path: data/raw/fbref_cache
          key: fbref-cache-${{ github.run_id }}
          restore-keys: |
            fbref-cache-

      - name: Sync dependencies
        run: uv sync --extra ingest --extra backtest

      # --- core pipeline: fast, always runs, always the thing that commits ---
      - name: Core data job (matches -> ratings -> calibration -> fixtures)
        env:
          FOOTBALL_DATA_ORG_API_KEY: ${{ secrets.FOOTBALL_DATA_ORG_API_KEY }}
        run: uv run python -m ingest.run_nightly

      # --- FBref: best-effort, time-boxed, never fails the job ---
      - name: FBref player/team stats (best effort)
        if: ${{ github.event_name == 'schedule' || inputs.with_fbref }}
        continue-on-error: true
        timeout-minutes: 35
        env:
          FOOTBALL_DATA_ORG_API_KEY: ${{ secrets.FOOTBALL_DATA_ORG_API_KEY }}
        run: timeout 1800 uv run python -m ingest.run_nightly --with-fbref || true

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed data/model reports/calibration || true
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "nightly data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
