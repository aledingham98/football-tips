name: odds-refresh

# The Odds API free tier, region=uk, markets=h2h,totals (2 credits/league/call;
# btts/props are paid). 2 leagues x 2 runs/day x 2 = 8 credits/day ~= 240/month
# of the free 500. The CreditBudgeter hard-stops before breaching the floor.

on:
  schedule:
    - cron: "0 8 * * *"      # ~08:00 UTC  (morning)
    - cron: "0 12 * * *"     # ~12:00 UTC  (~2h before Saturday 15:00 kickoffs)
  workflow_dispatch:

concurrency:
  group: odds-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - name: Fetch odds (budget-gated)
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: uv run python -m ingest.run_odds
      - name: Commit odds snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/odds/quota.json data/processed/odds_latest.parquet || true
          if git diff --cached --quiet; then
            echo "no odds changes"
          else
            git commit -m "odds refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
