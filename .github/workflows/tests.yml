name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev --extra ingest --extra backtest

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check (non-blocking)
        run: uv run mypy models simulation pricing ingest || true

      - name: Tests
        run: uv run pytest -q
