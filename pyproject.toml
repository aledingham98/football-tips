[project]
name = "football-tips"
version = "0.1.0"
description = "Personal EPL/EFL bet-builder and accumulator value pricer, built on one Monte Carlo match simulator."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

# Core = what the Streamlit app + engine + pricing need at runtime. Kept lean so
# the Streamlit Cloud build is fast. Ingestion-only deps live in extras.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "requests>=2.31",
    "python-dateutil>=2.9",
    "streamlit>=1.40",
]

[project.optional-dependencies]
# Nightly GitHub Action only - FBref via soccerdata (pulls Selenium etc.).
ingest = ["soccerdata>=1.8.7"]
# Phase 4 - Betfair delayed key.
betfair = ["betfairlightweight>=2.20"]
# Phase 5 - bet log persistence.
storage = ["supabase>=2.7"]
# Phase 2 - calibration plots.
backtest = ["matplotlib>=3.8"]
# Only if profiling shows the NumPy engine needs it.
perf = ["numba>=0.60"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest", "models", "simulation", "pricing", "storage"]

[tool.uv]
# Keep the deployed app lean: betfair/storage/backtest are pulled in per-phase.
default-groups = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q"
markers = ["perf: performance budget checks (timing-sensitive)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
